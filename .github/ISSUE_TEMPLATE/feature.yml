name: Idea or feature request
description: Suggest something PZAdmin could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation, rather than the solution, helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
